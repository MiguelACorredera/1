<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bit Masks Timezone Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <h1>🌎 Bit Masks Timezone Finder</h1>

        <div class="controls-panel">
            <div class="input-group">
                <label for="gmt-input">Enter GMT Offset (e.g., +3 or -4):</label>
                <input type="number" id="gmt-input" min="-12" max="12" value="2">
            </div>
            
            <div class="search-options">
                <label class="checkbox-container">
                    Search for cities NOT in this offset
                    <input type="checkbox" id="search-not">
                    <span class="checkmark"></span>
                </label>

                <button id="find-cities-btn">Find Cities</button>
            </div>
        </div>

        <div id="city-list">
            <h2>Timezones Defined</h2>
            </div>

        <hr>

        <div class="output-area">
            <h2>Search Results</h2>
            <p id="summary-count" class="summary">0 cities found.</p>
            <ul id="results-list">
                </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
